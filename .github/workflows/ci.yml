name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Production/integration audit tests require a dedicated Supabase test project.
      # Keep this CI gate isolated to deterministic unit tests; never point it at production.
      - run: bun run test:ci
      - run: bun run build:ci
